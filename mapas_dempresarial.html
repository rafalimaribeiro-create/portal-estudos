etita a decisão que, em ação de reparação de prejuízos supostamente causados pela compensação e posterior depósito de cheque nominal endossado por quem não tinha poderes para tanto, condena a instituição financeira ao pagamento do valor das cártulas indevidamente compensadas. A pretensão da parte autora era a restituição dos prejuízos resultantes da desídia imputada à instituição financeira demandada ao deixar de conferir a regularidade de endossos lançados em cheques por ela compensados, equivalente aos valores despendidos para pôr fim às demandas judiciais contra ela ajuizadas pelos emitentes das cártulas. Contudo, o órgão julgador condenou o banco ao pagamento de valores referentes às cártulas indevidamente compensadas.Ao assim decidir, concedeu providência jurisdicional diversa da requerida, em flagrante desrespeito ao princípio da congruência. STJ. 3ª Turma. REsp 2.035.370-DF, Rel. Min. Ricardo Villas Bôas Cueva, julgado em 18/4/2023 (Info 771).\"}]}]},{\"title\":\"Modalidades(4)\",\"children\":[{\"title\":\"Cheque Cruzado\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"Na aposição de dois traços transversais e paralelos no anverso do titulo\"}]},{\"title\":\"Objetivo\",\"children\":[{\"title\":\"Conferir segurança a liquidação de cheques ao portador\"}]},{\"title\":\"Efeito\",\"children\":[{\"title\":\"Ao ser feito o cruzamento, o cheque só pode ser pago a um banco ou a um cliente do banco,...\"},{\"title\":\"MEDIANTE CREDITO EM CONTA, evitando o desconto na boca do caixa\"}]},{\"title\":\"FORMATO\",\"children\":[{\"title\":\"Em Branco ou Cruzamento geral\",\"children\":[{\"title\":\"Alem dos traços pode mencionar a palavra \\\"BANCO\\\" no titulo\"}]},{\"title\":\"Em preto Cruzamento Especial\",\"children\":[{\"title\":\"Alem dos traços é mencionado algum banco entre os traços\"}]}]}]},{\"title\":\"Cheque Visado\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"O banco confirma, mediante assinatura no verso do titulo, a exi juros moratórios? • Se houve apresentação do cheque para compensação: os juros moratórios começam a ser contados da primeira apresentação à instituição financeira sacada ou câmara de compensação. • E se não houve apresentação do cheque para compensação? Neste caso, os juros incidirão a partir do primeiro ato do beneficiário no qual ele busque a satisfação do crédito. Inexistindo apresentação do cheque para a compensação ao banco sacado, os juros de mora devem incidir a partir do primeiro ato do beneficiário tendente à satisfação do crédito estampado na cártula, o que pode se dar pelo protesto, notificação extrajudicial ou pela citação. A Lei do Cheque (Lei nº 7.357/85) possui regra expressa que disciplina os juros relacionados com a cobrança de crédito estampado neste título. Segundo o art. 52, II, do texto legal, os juros de mora devem ser contados desde a data da primeira apresentação do cheque pelo portador à instituição financeira. Por força desse dispositivo, podemos dizer que a obrigação decorrente do cheque, a despeito de ser uma forma de pagamento à vista, ganha os contornos da mora ex persona. Nesse contexto, a melhor interpretação a ser dada quando o cheque não for apresentado à instituição financeira sacada para a respectiva compensação, é aquela que reconhece o termo inicial dos juros de mora a partir do primeiro ato do credor no sentido de satisfazer o seu crédito, o que pode se dar pela apresentação, protesto, notificação extrajudicial, ou pela citação. STJ. 4ª Turma. REsp 1768022-MG, Rel. Min. Marco Buzzi, julgado em 17/08/2021 (Info 705).\"}]}]},{\"title\":\"Execução e Protesto\",\"children\":[{\"title\":\"O Protesto é necessario para cobrar coobrigados?\"},{\"title\":\"Não, basta declaração do banco de que não tinha fundos\"},{\"title\":\"Deve ser apresentado p/ protesto no lugar do pagamento\"},{\"title\":\"Ou seja, praça em que é mantida a conta do emitente OU\"},{\"title\":\"Local de domicilio do emitente\"}]},{\"title\":\"Pagamento\",\"children\ os\",\"children\":[{\"title\":\"contra devedor principal e avalistas\"}]},{\"title\":\"1 ANO\",\"children\":[{\"title\":\"Codevedores e avalistas\"}]}]},{\"title\":\"OBS\",\"children\":[{\"title\":\"Distribuidora de Laticínios Mantena Ltda. sacou, em 30/11/2017, duplicata de venda em face de Mercado Conselheiro Pena Ltda., no valor de R$ 8.700,00 (oito mil e setecentos reais), com vencimento em 02/02/2018. A duplicata não foi aceita nem o pagamento foi efetuado no vencimento. Em 07/05/2022, o título foi levado a protesto e o sacado intimado de sua apresentação no dia seguinte. Em 09/05/2022, o sacado apresentou ao tabelião suas razões para impedir o protesto, limitando-se a invocar a prescrição da pretensão à execução da duplicata, tendo em vista as datas de vencimento e apresentação a protesto. O protesto foi lavrado em 10/05/2022. Consideradas as datas e os fatos narrados, assinale a afirmativa correta. Está prescrita a pretensão à execução da duplicata em razão do decurso de mais de 3 (três) anos da data do vencimento do título. FGV - 2022 - AGE-MG - Procurador do Estado\"},{\"title\":\"Art 18 - A pretensão à execução da duplicata prescreve: (Redação dada pela Lei nº 6.458, de 1º.11.1977) l - contra o sacado e respectivos avalistas, em 3 (três) anos, contados da data do vencimento do título; (Redação dada pela Lei nº 6.458, de 1º.11.1977) ll - contra endossante e seus avalistas, em 1 (um) ano, contado da data do protesto; (Redação dada pela Lei nº 6.458, de 1º.11.1977) Ill - de qualquer dos coobrigados contra os demais, em 1 (um) ano, contado da data em que haja sido efetuado o pagamento do título. (Redação dada pela Lei nº 6.458, de 1º.11.1977) § 1º - A cobrança judicial poderá ser proposta contra um ou contra todos os coobrigados, sem observância da ordem em que figurem no título. (Redação dada pela Lei nº 6.458, de 1º.11.1977) § 2º - Os coobrigados da duplicata respondem solidariamente pelo aceite e pelo pagamento. (Redação dada pela Lei nº 6.458, de 1º.11.197
