icoes a que a conversao acaso fique sujeita\"},{\"title\":\"numero de acoes que em que pode ser convertida\"},{\"title\":\"relação entre o valor nominal da debenture e preco de emissao das ações\"}]},{\"title\":\"Prerrogativas de debentures conversiveis em ações\",\"children\":[{\"title\":\"§ 2º Enquanto puder ser exercido o direito à conversão, dependerá de prévia aprovação dos debenturistas, em assembléia especial, ou de seu agente fiduciário, a alteração do estatuto para: a) mudar o objeto da companhia; b) criar ações preferenciais ou modificar as vantagens das existentes, em prejuízo das ações em que são conversíveis as debêntures.\"}]}]},{\"title\":\"Tem valor expresso em Moeda nacional\",\"children\":[{\"title\":\"Salvo, em casos de obrigações que nos termos da legislacão em vigor, possa ter pagto estipulado em moeda estrangeira - Quadrix - 2023 - PROCON-DF - Analista De Atividades De Defesa Do Consumidor - Direito e Legislação\"}]}]},{\"title\":\"Emissão\",\"children\":[{\"title\":\"Em regra\",\"children\":[{\"title\":\"Cabe a Assemb.-geral, PRIVATIVAMENTE deliberar sobre emissão de debentures\"},{\"title\":\"Deve observar o estatuto e a deliberacao deve fixar\"}]},{\"title\":\"CONSELHO de ADMINISTRAÇAO PODE EMITIR? Existe possibilidade de Emissão de debentures pelo Conselho de Administração\",\"children\":[{\"title\":\"Ocorre em companhias abertas\"},{\"title\":\"Emissao de debentures nao conversiveis em acao\"},{\"title\":\"Salvo disposição estatutaria em contrario\"}]},{\"title\":\"Limitação de emissão\",\"children\":[{\"title\":\"Até 2011 existia uma limitacão de endividamento, mas a limitação foi revogada\"}]},{\"title\":\"Deliberada sua emissão a Lei prevê  alguns requisitos formais - Art. 62 da LSA\",\"children\":[{\"title\":\"Arquivamento no registro do comercio, publicacao da ata da assemb. geral ou do conselho de adm\"},{\"title\":\"Inscrição da escritura de emissao no reg. do comercio\",\"children\":[{\"title\":\"OBS\",\"children\":[{\"title\":\"Registros de comercio devem manter livro especial p/ emissao de debentures\"}]}]},{\"title\":\"constituição das garantias reais se for o caso\"},{\"title\":\"Não obediencia do art. 62\",\"children\":[{\"title\":\"Os adm. respondem por perdas e danos a empresa ou terceiros\"}]}]}]},{\"title\":\"Especies de Debentures\",\"children\":[{\"title\":\"Com Garantia Real\",\"children\":[{\"title\":\"Deve ser registrada no registro do comercio\"}]},{\"title\":\"Com Garantia Flutuante\",\"children\":[{\"title\":\"Assegura privilegio geral sobre o ativo da companhia\"},{\"title\":\"Nao impede negociacao de bens que compoem esse ativo\"}]},{\"title\":\"Quirografarias/Não gozar de preferencia\"},{\"title\":\"Subordinadas\"}]},{\"title\":\"Agentes Fiduciarios\",\"children\":[{\"title\":\"Art. 68. O agente fiduciário representa, nos termos desta Lei e da escritura de emissão, a comunhão dos debenturistas perante a companhia emissora.\"},{\"title\":\"Responde perante debenturistas se agir com culpa ou dolo\"},{\"title\":\"§ 3º O agente fiduciário pode usar de qualquer ação para proteger direitos ou defender interesses dos debenturistas, sendo-lhe especialmente facultado, no caso de inadimplemento da companhia:\",\"children\":[{\"title\":\"a) declarar, observadas as condições da escritura de emissão, antecipadamente vencidas as debêntures e cobrar o seu principal e acessórios;\"},{\"title\":\"b) executar garantias reais, receber o produto da cobrança e aplicá-lo no pagamento, integral ou proporcional, dos debenturistas;\"},{\"title\":\"c) requerer a falência da companhia emissora, se não existirem garantias reais;\"},{\"title\":\"d) representar os debenturistas em processos de falência, concordata, intervenção ou liquidação extrajudicial da companhia emissora, salvo deliberação em contrário da assembléia dos debenturistas;\"},{\"title\":\"e) tomar qualquer providência necessária para que os debenturistas realizem os seus créditos.\"}]}]}]},{\"title\":\"CCI e LCI\"}]}]},\"cap7\":{\"title\":\"7. Contratos Bancários\",\"children\":[{\"title\":\"Intro\",\"children\":[{\"title\":\"Atividade bancaria é a intermediação de recursos entre os agentes economicos\"},{\"title\":\"A atividade está regulada na Lei 4.595/1964 e continua em vigor, msm com a EC\"},{\"title\":\"Apos a CF o STF passou a ser regulamentado por LC. Esta Lei nunca foi regulamentada\"},{\"title\":\"Havia disposição sobre juros e crime em relação a isso, mas EC 40/2003 mudou o texto\"},{\"title\":\"Apos essa EC o SFN foi fatiado em varias LC`s. A LC nunca foi editada\"},{\"title\":\"Instituições Financeiras - Art. 17 da Lei - PJ`s públicas ou privadas, que tenham como atividade principal ou acessoria a coleta, intermediação ou aplicação de recursos financeiros proprios ou de terceiros, em moeda nacional ou estrangeira e custodia de valores\"},{\"title\":\"A atividade bancaria é exercida pelas instituições financeiras e somente podem atuar no Brasil com autorização do BACEN ou Decreto do PExec.. Essas instituições, se privadas, devem ser S.A ou cooperativas e a totalidade de seu capital deve ser de ações nominativas\"}]},{\"title\":\"Conceito\",\"children\":[{\"title\":\"Modalidades contratuais formalizadas pelos bancos no ex. de ativ. bancaria\"},{\"title\":\"Em todo contrato bancario existe um Banco, mas ele não celebra somente esses contratos\"},{\"title\":\"São necessários 2 req.: BANCO e ATIVIDAD BANCARIA(coleta, intermediação e aplicação\"},{\"title\":\"São contratos que se submetem ao CDC\"},{\"title\":\"S. 381 do STJ\",\"children\":[{\"title\":\"Contratos Bancarios não podem ser declarados abusivos de oficio pelo juiz\"}]}]},{\"title\":\"Entendimentos Importantes - Ler\",\"children\":[{\"title\":\"IF não se sujeitam a limitação de juros remuneratórios estipulada na Lei de Usura\"},{\"title\":\"Juros remuneratorios maiores que 12% a.a por si só não sao abusivos\"},{\"title\":\"São inaplicaveis juros remuneratorios em contratos de mutuo bancario\"},{\"title\":\"OBS\",\"children\":[{\"title\":\"Súmula 30 do STJ: A comissão de permanência e a correção monetária são inacumuláveis Súmula 472 do STJ: A cobrança de comissão de permanência – cujo valor não pode ultrapassar a soma dos encargos remuneratórios e moratórios previstos no contrato – exclui a exigibilidade dos juros remuneratórios, moratórios e da multa contratual. CESPE / CEBRASPE - 2023 - TJ-DFT - Juiz de Direito Substituto\"}]}]},{\"title\":\"Tipicos ou Atipicos\",\"children\":[{\"title\":\"Tipicos\",\"children\":[{\"title\":\"Atividade bancaria propriamente dita(Ex: deposito, mutuo e desconto)\"},{\"title\":\"Podem ser passivos(banco devedor) ou ativo(banco credor)\"}]},{\"title\":\"Atipicos\",\"children\":[{\"title\":\"Op. correlatas ou acessórias a atividade bancaria(Ex: leasing, alienação fiduciaria, faturização e CC)\"}]}]},{\"title\":\"Contratos Tipicos\",\"children\":[{\"title\":\"Deposito Bancário\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"É um contrato de Op. Passivas(BANCO DEVEDOR). É a CONTA.\"},{\"title\":\"A entrega ao banco certa quantia, cabendo ao banco restitui-la(custódia de valores pelo banco)\"},{\"title\":\"O saque é feito por cheque, Doc ou Ted, cartao de débito e outros\"},{\"title\":\"Nem sempre tem incidencia do CDC\"},{\"title\":\"A instituição não precisa ser necessariamente S.A, por exemplo, a CAIXA\"},{\"title\":\"Banco se torna proprietario dos valores e não detentor\"}]},{\"title\":\"Classificação\",\"children\":[{\"title\":\"Real - Aperfeiçoa somente com a entrega ao banco\"}]},{\"title\":\"Especies(3)\",\"children\":[{\"title\":\"Deposito a Vista\",\"children\":[{\"title\":\"Banco deve restituir imediatamente a quantia\"}]},{\"title\":\"Deposito a Pré-aviso\",\"children\":[{\"title\":\"Restituição qnd solicitada deve ser feita no prazo estipulado\"}]},{\"title\":\"Deposito a Prazo Fixo\",\"children\":[{\"title\":\"Restituição só pode ocorre apos determinada data(poupança)\"}]}]}]},{\"title\":\"Mutuo Bancario (emprestimo bancario) CEBRASPE - 2023 - DPE-RO - Defensor\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"Trata-se de uma operacão ATIVA do banco\"},{\"title\":\"É um emprestimo por meio do qual o banco disponibiliza determinada quantia\"},{\"title\":\"Cabendo ao devedor pagar essa quantia, com acrescimos, no prazo fixado\"}]},{\"title\":\"Classificação\",\"children\":[{\"title\":\"Contrato Real\"},{\"title\":\"Unilateral(banco não assume obrigação)\"}]},{\"title\":\"Tx. de Juros aplicavel\",\"children\":[{\"title\":\"Limitação de 12% a.a não se aplicam as instituições financeiras\"},{\"title\":\"Juros remune. maiores que 12% a.a por si só não sao abusividade\"}]},{\"title\":\"S. 26 do STJ\",\"children\":[{\"title\":\"Avalista de titulo de credito vinculado ao mutuo bancario tbm responde pelas obrigações - solidario\"}]}]},{\"title\":\"Desconto Bancário\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"É antecipação de pagto ao cliente, q em troca cede ao banco determinado credito...\"},{\"title\":\"Ainda que não vencido, contra ele mesmo ou contra terceiro\"},{\"title\":\"Esse credito cedido geralmente é documentado por um titulo de credito\"},{\"title\":\"O banco ao ceder o valor, nao antecipa o valor total do credito, há um desagio q é oganho economico\"},{\"title\":\"Portador de certo titulo transfere a inst. financeira antes do vencimento\"},{\"title\":\"E recebe valor nominal do titulo há um desagio\"},{\"title\":\"obs\",\"children\":[{\"title\":\"Desconto Bancário é a antecipação de um direito creditório, ou seja, é receber por uma venda antes da data combinada. Esta operação de crédito, muito comum no mercado bancário, pode ter como origem dos direitos creditórios duplicatas, notas promissórias, cheques pré-datados e recebíveis de cartão de crédito\"}]}]},{\"title\":\"D. de Regresso\",\"children\":[{\"title\":\"Caso o credito nao seja honrado pelo devedor o banco tem d. de regresso\"},{\"title\":\"Geralmente o direito é cedido por endosso do banco, o que acaba por protege-lo\"}]}]},{\"title\":\"Credito Documentário\",\"children\":[{\"title\":\"Tem relação com cartas de credito do comercio internacional\"},{\"title\":\"Em q frequentemente nao ha confiança reciproca entre os contratantes\"},{\"title\":\"Pela ausencia de relações comerciais anteriores\"},{\"title\":\"Contratantes p/ garantir q o contrato será seguido a risca, confiam em uma inst. bancaria\"},{\"title\":\"Para intermediar a negociação. Ex: Importador fornece carta de credito ao banco\"},{\"title\":\"Deve ter comprovação do negocio juridico, que ocorre pela carta de credito\"}]},{\"title\":\"Abertura de Crédito\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"Banco poe a disposição do cliente determinada quantia de dinheiro que ele pode usar\"},{\"title\":\"Ganho do banco está no juros, praticamente. Existe tb possibildade de comissão\"},{\"title\":\"É o chamado \\\"cheque especial\\\"\"},{\"title\":\"As duas espécies mais comuns desse contrato são: a) Contrato de abertura de crédito fixo; b) Contrato de abertura de crédito rotativo\"}]},{\"title\":\"CONTRATO DE ABERTURA DE CREDITO FIXO\",\"children\":[{\"title\":\"O contrato de crédito fixo consiste na concessão, por parte da instituição financeira ao seu cliente, de valor certo, com termo e encargos pré-definidos. No momento da assinatura do contrato, o contratante já sabe de antemão o valor total da dívida. O contrato de abertura de crédito fixo equivale a um contrato de mútuo feneratício. Depois de assinado o pacto, o banco credita o valor certo e determinado da quantia ao cliente e este assume a obrigação de devolvê-la com juros e correção monetária, quando chegar o termo ajustado.\"}]},{\"title\":\"STJ - S. 233\",\"children\":[{\"title\":\"Não é titulo executivo extrajudicial, ainda q tenha extrato pormenorizado do debito\"},{\"title\":\"Mas pode embasar eventual açao monitória - S. 247 do STJ\"}]},{\"title\":\"S. 322 do STJ\",\"children\":[{\"title\":\"P/ repetição do indebito, em contratos de abertura de credito, nao se exige prova do erro\"}]},{\"title\":\"OBS\",\"children\":[{\"title\":\"Não há vedação à adoção da variação dos Certificados de Depósitos Interbancários - CDI como encargo financeiro em contratos bancários, devendo o abuso ser observado caso a caso, em cotejo com as taxas médias de mercado regularmente divulgadas pelo Banco Central do Brasil para as operações de mesma espécie, o que não ocorre na espécie. STJ. 4ª Turma.REsp 1.630.706-SP, Rel. Min. Maria Isabel Gallotti, julgado em 07/06/2022 (Info 742).\"},{\"title\":\"É admissível a estipulação dos encargos financeiros de contrato de abertura de crédito em percentual sobre a taxa média aplicável aos Certificados de Depósitos Interbancários (CDIs). Nos depósitos interbancários, como em qualquer outro tipo de empréstimo, a instituição tomadora paga juros à instituição emitente. A denominada Taxa CDI, ou simplesmente DI, é calculada com base nas taxas aplicadas em tais operações, refletindo, portanto, o custo de captação de moeda suportado pelos bancos. STJ. 3ª Turma. REsp 1.781.959-SC, Rel. Min. Ricardo Villas Bôas Cueva, julgado em 11/02/2020 (Info 665).\"}]}]}]},{\"title\":\"Contratos Bancarios Improprios\",\"children\":[{\"title\":\"Intro\",\"children\":[{\"title\":\"Modalidades contratuais q a doutrina diverge acerca de sua natureza tipica bancaria\"}]},{\"title\":\"Alienação Fiduciária\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"Contrato INSTRUMENTAL no qual uma das partes em confiança\",\"children\":[{\"title\":\"Pq instrumental?\",\"children\":[{\"title\":\"É utilizado como meio para outro negocio\"},{\"title\":\"Geralmente associado a um MUTUO, servindo-lhe de garantia\"}]}]},{\"title\":\"ALIENA a outra a propriedade de certo bem, movel ou imovel,\"},{\"title\":\"Ficando esta parte obrigada a devolver a outra\"},{\"title\":\"O bem que foi alienado qnd verificada a ocorrencia de certo fato\"},{\"title\":\"Leis do CC aplicam-se de forma subsidiaria\"},{\"title\":\"Há uma propriedade resoluvel\"},{\"title\":\"Na alienação fiduciária é necessário a prova por escrito\"}]},{\"title\":\"Disciplina Legal 2022 - TRF - 3ª REGIÃO - Juiz\",\"children\":[{\"title\":\"Bem imovel -  9.514/1997\"},{\"title\":\"Se de mercado financ. e capitais no Art. 68-B da Lei 4.728/65\"},{\"title\":\"Há o Dec.-Lei 911/1969 - Bens Moveis\"},{\"title\":\"Há ainda o CC no art. 1.361 a 1.368(Prop. Fiduciaria)\"},{\"title\":\"De aeronaves(codigo de aeronautica) - inst. publico ou particular\"},{\"title\":\"obs\",\"children\":[{\"title\":\"MUTUO COM ALIENAÇÃO FIDUCIARIA PRAZO DE PRESCRIÇÃO. INICIO\",\"children\":[{\"title\":\"Caso hipotético: Valdir comprometeu-se a administrar a fazenda de Paulo e, como contrapartida, quando este a vendesse, o administrador teria direito a 20% do valor obtido. Em 01/04/2013, Paulo celebrou, com a CEF, contrato de mútuo com alienação fiduciária. A fazenda foi instituída como garantia da alienação fiduciária, ou seja, passou à propriedade resolúvel da CEF. Como Paulo não pagou o mútuo, em 25/05/2015, houve a consolidação da propriedade do imóvel rural em nome da CEF. Qual é o prazo para Valdir cobrar os 20% a que ele teria direito? 5 anos. É de 5 anos o prazo prescricional para a pretensão de cobrança de dívidas líquidas constantes de instrumento particular (art. 205, § 5º, I, do Código Civil). Esse prazo teve início com a instituição da garantia da alienação fiduciária ou com a consolidação da propriedade do imóvel em nome do banco? Com a consolidação da propriedade. No contrato de mútuo com alienação fiduciária, o prazo quinquenal de prescrição é contado da  D A T A  E M  Q U E  C O N S O L I D A D A  a propriedade do imóvel em nome da instituição financeira (transferência definitiva da propriedade do imóvel), e não da data em que instituída a garantia da alienação fiduciária. STJ. 4ª Turma. REsp 2018619-SP, Rel. Min. Raul Araújo, julgado em 04/10/2022 (Info 752).\"}]},{\"title\":\"ATRASO EM BAIXAR O GRAVAME DANO MORAL IN RE IPSA?\",\"children\":[{\"title\":\"O atraso, por parte de instituição financeira, na baixa de gravame de alienação fiduciária no registro de veículo não caracteriza, por si só, dano moral in re ipsa. (REsp. 1.881.453-RS, Rel. Min. Marco Aurélio Bellizze, Segunda Seção, por unanimidade, julgado em 30/11/2021, DJe 07/12/2021. (Tema 1078).\"}]},{\"title\":\"EXTRAPETITA E BAP\",\"children\":[{\"title\":\"O contrato de alienação fiduciária em garantia de bem móvel não se extingue somente por força da consolidação da propriedade em nome do credor fiduciário. A reversão da propriedade plena (consolidação) em favor do credor fiduciário (banco) constitui apenas uma etapa da execução do contrato, não pondo fim a ele. O julgamento extra petita está configurado quando o magistrado concede prestação jurisdicional diversa da pleiteada na inicial. No caso concreto, mesmo sem pedido de rescisão do contrato de alienação fiduciária, a sentença reconheceu extinta a relação contratual, sendo, portanto, considerada extra petita. Há julgamento extra petita na hipótese em que, julgado procedente o pedido de busca e apreensão de bem alienado fiduciariamente, o juiz, sem o requerimento expresso do autor, extingue o contrato firmado entre o devedor fiduciante e o credor fiduciário. STJ. 3ª Turma. REsp 1779751-DF, Rel. Min. Ricardo Villas Bôas Cueva, julgado em 16/06/2020 (Info 678).\"}]},{\"title\":\"RESCISÃO E DEVOLUÇÃO DO VALOR PAGO CDC X LEI ESPECIFICA\",\"children\":[{\"title\":\"Exemplo: João celebrou contrato de compra e venda com alienação fiduciária em garantia de um imóvel. O ajuste previa o pagamento em 120 prestações mensais. Após 60 prestações pagas, João ajuizou ação de resolução do contrato contra a construtora alegando que não tinha mais condições de continuar pagando as parcelas. Na ação, o autor pediu a dissolução do vínculo obrigacional, afirmando que entrega o imóvel e que, como consequência, quer receber de volta as prestações pagas, podendo o vendedor reter 10% dos valores já recebidos a título de despesas que eventualmente tenha sido, nos termos do art. 53 do CDC. O pedido do autor deve ser acolhido? Não. No caso concreto, o que houve foi uma quebra antecipada do contrato por parte do comprador. De acordo com a quebra antecipada do contrato (chamada de antecipatory breach, na common law), há inadimplemento, mesmo antes do vencimento, quando o devedor pratica atos abertamente contrários ao cumprimento do contrato. Neste caso, é possível o desfazimento do contrato, no entanto, a devolução dos valores pagos pelo autor não se dará na forma do art. 53 do CDC, mas sim segundo o procedimento estabelecido nos arts. 26 e 27 da Lei nº 9.514/97, pelo qual, resolvido o contrato de compra e venda, consolida-se a propriedade do bem na pessoa do credor fiduciário que irá vende-lo por meio de leilão. Com o resultado, serão pagos os débitos, devolvendo-se ao antigo adquirente o que sobrar. STJ. 3ª Turma. REsp 1867209-SP, Rel. Min. Paulo de Tarso Sanseverino, julgado em 08/09/2020 (Info 680).\"}]}]}]},{\"title\":\"Partes no Contrato\",\"children\":[{\"title\":\"Devedor-fiduciante(Adquire o bem)\"},{\"title\":\"Credor-fiduciario(empresta o valor)\"},{\"title\":\"Terceiro(vendedor do bem)\"},{\"title\":\"OBS\",\"children\":[{\"title\":\"Entendimento STJ - Bem FCC - 2018 - MPE-PB - Promotor CESPE / CEBRASPE - 2023 - AGU - PFN\",\"children\":[{\"title\":\"Esse contrato pode recair sobre bem do proprio devedor fiduciante(REFINANCIAMENTO)\"}]}]}]},{\"title\":\"Bens Imoveis (Lei 9.514/1997) FAURGS - 2022 - TJ-RS - Juiz IESES - 2021 - TJ-RO -Cart.  FCC - 2021 - DPE-GO - Defensor 2022 - TRF - 3ª REGIÃO - Juiz\",\"children\":[{\"title\":\"Conceito  FCC - 2022 - TJ-CE - Oficial de Justiça\",\"children\":[{\"title\":\"É o neg. juridico pelo qual o devedor, ou fiduciante, com escopo de garantia\"},{\"title\":\"Contrata transferencia ao credor, ou fiduciario, da propriedade resoluvel de coisa imovel\"},{\"title\":\"transfere ao CREDOR o DOMÍNIO RESOLÚVEL(NAO É PROPRIEDADE)\"},{\"title\":\"tornando-se o alienante ou devedor em possuidor direto e depositário\"},{\"title\":\"Pode ser contratada por PF ou PJ, nao sendo privativa das entidades do SFI\"},{\"title\":\"O contrato tem requisitos formais. Ex: Valor da divida\"},{\"title\":\"Pode ter por objeto direitos reais de uso e direito especial de uso para fins de moradia.\"},{\"title\":\"OBS\",\"children\":[{\"title\":\"É constitucional o procedimento da Lei nº 9.514/1997 para a execução extrajudicial da cláusula de alienação fiduciária em garantia, haja vista sua compatibilidade com as garantias processuais previstas na Constituição Federal. STF. Plenário. RE 860.631/SP, Rel. Min. Luiz Fux, julgado em 26/10/2023 (Repercussão Geral – Tema 982) (Info 1114).\"}]}]},{\"title\":\"Constituição da Prop. Fiduciaria  FCC - 2022 - TJ-CE - Oficial de Justiça\",\"children\":[{\"title\":\"Constitui-se a propriedade fiduciária de coisa imóvel mediante registro, no competente Registro de Imóveis, do contrato que lhe serve de título. Parágrafo único. Com a constituição da propriedade fiduciária, dá-se o desdobramento da posse, tornando-se o fiduciante possuidor direto e o fiduciário possuidor indireto da coisa imóvel.\"},{\"title\":\"obs\",\"children\":[{\"title\":\"Ausencia de Registro E EXIGENCIA DE VENDA EXTRAJUDICIAL\",\"children\":[{\"title\":\"No regime especial da Lei 9.514/97, o registro do contrato tem natureza constitutiva, sem o qual a propriedade fiduciária e a garantia dela decorrente não se perfazem. N A  A U S E N C I A  de registro do contrato que serve de título à propriedade fiduciária no competente Registro de Imóveis, como determina o art. 23 da Lei nº 9.514/97, N Ã O  É  E X I G I V E L do adquirente que se submeta ao procedimento de venda extrajudicial do bem para só então receber eventuais diferenças do vendedor. STJ. 3ª Turma. REsp 1835598-SP, Rel. Min. Nancy Andrighi, julgado em 09/02/2021 (Info 685). O julgado acima foi parcialmente superado pelo seguinte entendimento proferido pela 2ª Seção do STJ em embargos de divergência: A ausência de registro do contrato que serve de título à propriedade fiduciária no Registro de Imóveis não retira a validade do ajuste entre os contratantes. Vale ressaltar, no entanto, que, para poder promover a alienação extrajudicial do bem, é necessário que se providencie registro do contrato. STJ. 2ª Seção. EREsp 1.866.844-SP, Rel. Min. Nancy Andrighi, Rel. para acórdão Min. Ricardo Villas Bôas Cueva, julgado em 27/9/2023 (Info 789).\"}]}]}]},{\"title\":\"Paga a DIVIDA e Encargos\",\"children\":[{\"title\":\"Prop. fiduciaria se resolve e emite-se termo de quitação em 30 dias\"},{\"title\":\"obs\",\"children\":[{\"title\":\"O credor fiduciário, antes da consolidação da propriedade e da imissão na posse no imóvel objeto da alienação fiduciária, não pode ser considerado sujeito passivo do IPTU, uma vez que não se enquadra em nenhuma das hipóteses previstas no art. 34 do CTN. Além disso, o § 8º do art. 27 da Lei nº 9.514/97 afirma expressamente que o credor fiduciário só responde pelo pagamento dos impostos relacionados com o bem se houver a consolidação da propriedade e a imissão na posse. STJ. 1ª Turma. AREsp 1796224-SP, Rel. Min. Gurgel de Faria, julgado em 16/11/2021 (Info 720\"}]}]},{\"title\":\"Não Paga a DIVIDA e Encargos\",\"children\":[{\"title\":\"Consolida-se a propriedade em nome do credor fiduciario\"},{\"title\":\"Credor fiduciario promoveRÁ leilao publico para venda do bem (É obrigatório, o credor nao ficar com a propriedae plena)\"},{\"title\":\"Leilao deve ser promovido em 60 dias e dependendo do valor outro em 15d\"},{\"title\":\"Há um prazo de 15 dias p/ pagamento(intimação pessoal). a Lei preve expressamente a possibilidade de citação por hora certa e dps edital\"},{\"title\":\"Purgada a mora no Registro de Imóveis, convalescerá o contrato de alienação\"},{\"title\":\"OBS\",\"children\":[{\"title\":\"Em contrato de compra e venda de imóvel com garantia de alienação fiduciária devidamente registrado em cartório, a resolução do pacto, na hipótese de inadimplemento do devedor, devidamente constituído em mora, deverá observar a forma prevista na Lei nº 9.514/97, por se tratar de legislação específica, afastando-se, por conseguinte, a aplicação do Código de Defesa do Consumidor. STJ. 2ª Seção. REsp 1.891.498-SP, Rel. Min. Marco Buzzi, julgado 26/10/2022 (Recurso Repetitivo – Tema 1095) (Info 755)\"},{\"title\":\"Se o devedor fiduciante se escusa, por diversas vezes, de receber as intimações para purgar a mora em seu endereço comercial, conforme expressamente indicado no contrato de alienação fiduciária de imóvel, induzindo os Correios a erro ao indicar possível mudança de domicílio que nunca existiu, não há óbice à sua intimação por edital. STJ. 4ª Turma. REsp 1.733.777-SP, Rel. Min. Maria Isabel Gallotti, julgado em 17/10/2023 (Info 794).\"},{\"title\":\"Antes da Lei 13.465/2017: mesmo que já consolidada a propriedade do imóvel dado em garantia em nome do credor fiduciário, era possível a purgação da mora. A purgação era admitida até a assinatura do auto de arrematação. Após a Lei 13.465/2017: não se admite a purgação da mora após a consolidação da propriedade em favor do credor fiduciário, sendo assegurado ao devedor fiduciante tão somente o exercício do direito de preferência. Desse modo, não se admite a purgação da mora, nos contratos de mútuo imobiliário com pacto adjeto de alienação fiduciária, submetidos à Lei nº 9.514/97 com a redação dada pela Lei nº 13.465/2017, nas hipóteses em que a consolidação da propriedade em favor do credor fiduciário ocorreu na vigência da nova lei, sendo assegurado ao devedor fiduciante tão somente o exercício do direito de preferência. STJ. 2ª Seção. REsp 1.942.898-SP, Rel. Min. Ricardo Villas Bôas Cueva, julgado em 23/8/2023 (Info 15 – Edição Extraordinária).\"}]}]},{\"title\":\"Inadimplemento\",\"children\":[{\"title\":\"Reversão do bem deve ser processada pelo of. do cartório, independendo de ação judicial\"}]},{\"title\":\"Taxa de Ocupação\",\"children\":[{\"title\":\"O art. 37-A da Lei nº 9.514/97 prevê que, se o fiduciante, mesmo estando inadimplente, continuar morando no imóvel, o fiduciário (credor) poderá exigir o pagamento de um valor chamado de “taxa de ocupação”. A Lei 13.465/2017 alterou o art. 37-A da Lei nº 9.514/97 e passou a dizer expressamente que a taxa de ocupação será exigível do fiduciante em mora desde a data da consolidação da propriedade fiduciária no patrimônio do credor fiduciante. STJ - Se o imovel nao esta construido nao faz sentido a taxa de ocupação\"},{\"title\":\"obs\",\"children\":[{\"title\":\"O  L O C A T A R I O  do imóvel cuja propriedade foi consolidada nas mãos do credor fiduciário diante da inadimplência do devedor fiduciante (antigo locador do bem)  N Ã O  é parte legítima para responder pela taxa de ocupação, prevista no art. 37-A da Lei nº 9.514/97, por não fazer parte da relação jurídica que fundamenta a cobrança da taxa em questão. Exemplo hipotético: Pedro (devedor fiduciante) alugou o imóvel objeto da alienação fiduciária para Carlos. Pedro não pagou as prestações do mútuo ao banco e houve a consolidação da propriedade em nome do credor fiduciário (instituição financeira). O banco não pode cobrar a taxa de ocupação de Carlos. STJ. 4ª Turma. REsp 1966030-SP, Rel. Min. Antonio Carlos Ferreira, julgado em 23/11/2021 (Info 720).\"},{\"title\":\"Em operações de financiamento imobiliário garantidas por alienação fiduciária,                         N Ã O  é possível a flexibilização do percentual da taxa de ocupação de imóvel estabelecido no art. 37-A da Lei nº 9.514/97 a critério do julgador. STJ. 3ª Turma. REsp 1999485-DF, Rel. Min. Nancy Andrighi, Rel. para acórdão Min. Ricardo Villas Bôas Cueva, julgado em 6/12/2022 (Info 762).\"}]}]}]},{\"title\":\"BENS MOVEIS Inadimplemento ou Mora Procedimento Dec.-Lei 911/1969 - Bens Moveis\",\"children\":[{\"title\":\"Intro\",\"children\":[{\"title\":\"Proprietario ou credor pode vender a coisa a terceiros\"},{\"title\":\"Independente de leilao, hasta publica, aval. previa ou qlq outra medida jud. ou extrajud.\"},{\"title\":\"Salvo disposição expressa no contrato\"},{\"title\":\"Deve aplicar o preco da venda no pagto do credito e das despesas\"},{\"title\":\"E entregar ao credor o saldo apurado, se houver\"},{\"title\":\"O mora decorre de simples inadimplemento(vencimento do prazo)\"},{\"title\":\"O pedido de recuperação judicial nao impede o BAP\"}]},{\"title\":\"Notificação do Devedor Comprovação da Mora\",\"children\":[{\"title\":\"É extrajudicial e ocorre para comprovar a mora\"},{\"title\":\"A notificação é indispensavel para o ajuizamento do BAP\"},{\"title\":\"É imprescindivel p/ o BAP?\",\"children\":[{\"title\":\"Sim, segundo STJ\"}]},{\"title\":\"Essa notificação dispensa indicação do valor do debito\"},{\"title\":\"Notificação é feita por carta registrada com AR(nao precisa ser cartorio - RTD)\"},{\"title\":\"Não exige assinatura do AR pelo proprio destinatario(basta a entrega)\"},{\"title\":\"Decorre de simples vencimento do prazo. Independe de aviso ou notificação\"},{\"title\":\"Pode ser comprovada por carta expedida por CARTORIO ou por PROTESTO\"},{\"title\":\"obs\",\"children\":[{\"title\":\"Súmula 92-STJ:A terceiro de boa-fé não é oponível a alienação fiduciária não anotada no certificado de registro do veículo automotor.\"},{\"title\":\"Súmula 72-STJ: A comprovação da mora é imprescindível à busca e apreensão do bem alienado fiduciariamente. • Importante. • O credor pode demonstrar a mora do devedor por meio de carta registrada com aviso de recebimento. Não mais se exige que a carta registrada seja expedida pelo Cartório de Títulos e Documentos. É dispensável que haja o protesto do título. Súmula 245-STJ: A notificação destinada a comprovar a mora nas dívidas garantidas por alienação fiduciária dispensa a indicação do valor do débito.\"},{\"title\":\"Para a comprovação da mora nos contratos garantidos por alienação fiduciária, é suficiente o envio de notificação extrajudicial ao devedor no endereço indicado no instrumento contratual, dispensando-se a prova do recebimento, quer seja pelo próprio destinatário, quer por terceiros. STJ. 2ª Seção.REsp 1.951.662-RS e REsp 1.951.888-RS, Rel. Min. Marco Buzzi, Rel. para acórdão Min. João Otávio de Noronha, julgados em 9/8/2023(Recurso Repetitivo – Tema 1132) (Info 782).\"},{\"title\":\"Exige anotaçao no CRV?\",\"children\":[{\"title\":\"Exemplo hipotético: Antônio queria comprar o carro de João (Honda Civic).Antônio procurou o Banco “X”, que celebrou com ele contrato de financiamento com garantia de alienação fiduciária.Assim, o Banco “X” emprestou R$ 40 mil a Antônio, que comprou o veículo de João. Ocorre que o automóvel, nos registros do DETRAN, continuou em nome de João, antigo proprietário, estranho à relação contratual firmada entre Antônio e o Banco “X”. Não foi feita a anotação da alienação fiduciária no CRV. Antônio deixou de pagar as prestações. Mesmo sem a anotação da alienação fiduciária no CRV, o Banco pode ajuizar ação de busca e apreensão do automóvel. A anotação da alienação fiduciária no certificado de registro do veículo não constitui requisito para a propositura da ação de busca e apreensão, uma vez que o registro é condição de eficácia da garantia perante terceiros e não entre os contratantes. Os documentos indispensáveis ao ajuizamento da ação de busca e apreensão são os seguintes: 1) a comprovação da mora do devedor fiduciante (Súmula 72/STJ); e 2) o contrato escrito celebrado entre as partes. Além disso, se o bem objeto da alienação fiduciária estiver registrado em nome de terceiro, a petição inicial deverá ser instruída com prova de que a posse do bem foi transferida ao devedor. STJ. 3ª Turma.REsp 2.095.740-DF, Rel. Min. Nancy Andrighi, julgado em 6/2/2024 (Info 800).\"}]}]},{\"title\":\"obs\",\"children\":[{\"title\":\"No caso de alienação fiduciária de bem imóvel a mora é ex re, segundo o disposto no § 2° do art. 2° do Decreto-Lei n. 911/1969, com a notificação servindo apenas a sua comprovação, não sendo de exigir-se, para esse efeito, mais do que a referência ao contrato inadimplido. Já em relação ao bem móvel: Art. 26. Vencida e não paga a dívida, no todo ou em parte, e constituídos em mora o devedor e, se for o caso, o terceiro fiduciante, será consolidada, nos termos deste artigo, a propriedade do imóvel em nome do fiduciário.    - fica claro que o mero inadimplemento não culmina em mora, devendo haver a interpelação do sujeito para tanto\"}]}]},{\"title\":\"Ajjuizamento da Ação Após a mora 2 opções\",\"children\":[{\"title\":\"1) poderá ingressar com uma ação de busca e apreensão requerendo que lhe seja entregue o bem (art. 3º do DL 911/69). Essa busca e apreensão prevista no DL 911/69 é uma ação especial autônoma e independente de qualquer procedimento posterior; ou\"},{\"title\":\"2) ajuizar uma ação de execução (arts. 4º e 5º do DL 911/69).\"},{\"title\":\"Ações nao pode ser ajuizadas concomitantemente\"},{\"title\":\"STJ\",\"children\":[{\"title\":\"A quem compete comprovar a venda do bem? É necessario ajuizar ação de prest. de contas?\",\"children\":[{\"title\":\"No procedimento da consolidação da propriedade fiduciária pelo Decreto-Lei nº 911/69, compete ao credor fiduciário, após a consolidação da propriedade decorrente da mora do devedor, o ônus de comprovar a venda do bem e o valor auferido com a alienação. Vale ressaltar, contudo, que as questões concernentes à venda extrajudicial do bem, imputação do valor alcançado no pagamento do débito e apuração acerca de eventual saldo remanescente em favor do devedor, em princípio, não podem ser discutidas, incidentalmente, no bojo da ação de busca e apreensão que visa tão somente à consolidação da propriedade do bem no patrimônio do credor fiduciário. É necessário o ajuizamento de ação de exigir contas. STJ. 4ª Turma. REsp 1742102-MG, Rel. Min. Marco Buzzi, julgado em 23/3/2023 (Info 769).\"}]},{\"title\":\"TITULO ORIGINAL\",\"children\":[{\"title\":\"Exemplo: João queria comprar um carro de R$ 100 mil, mas só tinha R$ 40 mil. Diante disso, ele procurou o banco para obter um empréstimo de R$ 60 mil. A instituição financeira aceitou emprestar a quantia, no entanto, exigiu que o negócio fosse assim materializado: i) João deveria emitir uma cédula de crédito bancário em favor da BV; ii) o carro adquirido deveria ficar em nome da BV como garantia em alienação fiduciária. Como João se tornou inadimplente, o banco ajuizou ação de busca e apreensão contra ele. É indispensável que o autor junte o original do título de crédito (no caso, a cédula de crédito bancário). Isso porque, se o bem não for encontrado, a busca e apreensão se converterá em execução e na execução é indispensável, como regra, a juntada do título original. Obs: a cédula de crédito pode ser emitida de forma cartular (“em papel”) ou escritural (eletrônica). Se a CCB for escritural, por óbvio, não há que se falar em juntada do original já que não é um documento físico. STJ. 3ª Turma. REsp 1946423-MA, Rel. Min. Nancy Andrighi, julgado em 09/11/2021 (Info 717).\"}]}]}]},{\"title\":\"Concessao de Liminar\",\"children\":[{\"title\":\"O juiz concederá a busca e apreensão de forma liminar (sem ouvir o devedor), desde que comprovada a mora ou o inadimplemento do devedor (art. 3º do DL 911/69).\"},{\"title\":\"Callout\",\"children\":[{\"title\":\"COMPETENCIA\",\"children\":[{\"title\":\"Caso adaptado: Alfa Ltda. celebrou, em Pinhais (PR), contrato de financiamento com garantia de alienação fiduciária com o Banco para aquisição de um caminhão. Após alguns meses, a Alfa parou de pagar as prestações do contrato. O Banco ajuizou, na comarca de Pinhais (PR), ação de busca e apreensão contra a empresa requerendo que lhe seja entregue o bem (art. 3º do DL 911/69). O magistrado concedeu a liminar determinando que o veículo fosse devolvido. O Banco solicitou o cumprimento da decisão ao juízo de São Luiz (MA), onde o caminhão estava localizado. Esse requerimento foi formulado com base no art. 3º, § 12 do DL 911/69. A empresa quer interpôs Alfa agravo de instrumento contra a decisão que concedeu a liminar. A competência para julgar esse agravo é do TJ/PR (e não do TJ/MA). A efetivação de medida liminar concedida em ação de busca e apreensão de bem móvel, por Juízo onde se localize o bem, a pedido da parte interessada, com fundamento no art. 3º, § 12, do Decreto-Lei n. 911/1969, não atrai a competência desse Juízo para eventual impugnação ao conteúdo de tal liminar, que deverá ser postulada perante o Juízo da causa que concedeu a liminar, afigurando-se igualmente competente para o julgamento de eventual recurso interposto contra essa decisão o Tribunal ao qual se encontra vinculado esse Juízo natural. STJ. 2ª Seção. CC 186.137-PR, Rel. Min. Marco Aurélio Bellizze, julgado em 8/11/2023 (Info 794).\"}]}]}]},{\"title\":\"Possibilidade de Pagto Integral da Divida FGV - 2022 - AGE-MG - Procurador\",\"children\":[{\"title\":\"No prazo de 5 dias após o cumprimento da liminar (apreensão do bem)\",\"children\":[{\"title\":\"stj\",\"children\":[{\"title\":\"O prazo de cinco dias para pagamento da integralidade da dívida, previsto no art. 3º, § 2º, do Decreto-Lei nº 911/1969, deve ser considerado de DIREITO MATERIAL, N Ã O  se sujeitando, assim, à contagem em dias úteis, prevista no art. 219, caput, do CPC/2015. STJ. 3ª Turma. REsp 1770863-PR, Rel. Min. Nancy Andrighi, julgado em 09/06/2020 (Info 673).\"}]}]},{\"title\":\"o devedor fiduciante poderá pagar a integralidade da dívida\"},{\"title\":\"segundo os valores apresentados pelo credor fiduciário na inicial\"},{\"title\":\"hip. na qual o bem lhe será restituído livre do ônus (§ 2º do art. 3º do DL 911/69).\"},{\"title\":\"é possivel adimplemento substancial? é descabida devido à exigência do pagamento da integralidade da dívida para o bem ser restituído ao devedor livre de ônus.\"},{\"title\":\"Sendo que o fiduciario nao poderia vender o bem durante esse prazo\"},{\"title\":\"obs\",\"children\":[{\"title\":\"Esse prazo é em dia util?\",\"children\":[{\"title\":\"O prazo de cinco dias para pagamento da integralidade da dívida, previsto no art. 3º, § 2º, do Decreto-Lei nº 911/1969, deve ser considerado de direito material, não se sujeitando, assim, à contagem em dias úteis, prevista no art. 219, caput, do CPC/2015. STJ. 3ª Turma. REsp 1770863-PR, Rel. Min. Nancy Andrighi, julgado em 09/06/2020 (Info 673).\"}]},{\"title\":\"O que é a integralidade?\",\"children\":[{\"title\":\"Nos contratos firmados na vigência da Lei 10.931/2004, compete ao devedor, no prazo de 5 (cinco) dias após a execução da liminar na ação de busca e apreensão, pagar a integralidade da dívida - entendida esta como os valores apresentados e comprovados pelo credor na inicial -, sob pena de consolidação da propriedade do bem móvel objeto de alienação fiduciária. STJ. 2ª Seção. REsp 1.418.593-MS, Rel. Min. Luis Felipe Salomão, julgado em 14/5/2014 (recurso repetitivo) (Info 540).\"}]}]}]},{\"title\":\"Resposta\",\"children\":[{\"title\":\"No prazo de 15 dias após o cumprimento da liminar (apreensão do bem)\"},{\"title\":\"o devedor fiduciante apresentará resposta (uma espécie de contestação).\"},{\"title\":\"Termo inicial dos 15d: Mandado de citação cumprido\"},{\"title\":\"A contestação pode ser apresentada antes\"},{\"title\":\"Mesmo com contestação a liminar será concedida\"},{\"title\":\"obs\",\"children\":[{\"title\":\"Na ação de busca e apreensão de que trata o DL 911/1969, a análise da contestação somente deve ocorrer após a execução da medida liminar. STJ. 2ª Seção. REsp 1.892.589-MG, Rel. Min. Paulo de Tarso Sanseverino, Rel. Acd. Min. Ricardo Villas Bôas Cueva, julgado em 16/09/2021 (Recurso Repetitivo – Tema 1040) (Info 710).\"}]}]},{\"title\":\"BAP Abusivo\",\"children\":[{\"title\":\"A Lei traz mecanismos pra evitar\"}]},{\"title\":\"Bem não encontrado ou  Não estiver na POSSE do DEVEDOR\",\"children\":[{\"title\":\"Pode ser requerida conversao do BAP em Ação de DEPOSITO\"},{\"title\":\"É uma regra polemica\"},{\"title\":\"Permitiria prisao do depositario infiel\"},{\"title\":\"A regra foi afastada pelo STJ, pois nao seria contrato de deposito, mas deposito ficto\"},{\"title\":\"Posteriormente, depois de entender que sim e que nao, STF jugou definitivamente\"}]}]}]},{\"title\":\"Arrendamento Mercantil(Leasing)\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"Contrato especial de LOCACAO q assegura ao locatario a prerrogativa de adquirir\"},{\"title\":\"O bem ao final da avença pagando uma diferenca chamada VALOR RESIDUAL\"},{\"title\":\"Neg. Juridico celebrando entre PJ(Arrendadora) e PF ou PJ(Arrendatario)\"},{\"title\":\"Tem por objeto arrendamento de bens adquiridos pela arrendadora\"},{\"title\":\"OBS - Nem todo contrato de locacao com opcao de compra é LEASING\"},{\"title\":\"OBS - Para ser leasing precisa atender a Lei, senão é Compra e Venda a prestacão\"}]},{\"title\":\"Opções ao Final  do ALUGUEL(3)\",\"children\":[{\"title\":\"- Renovar a locacao, prorrogando o contrato;\"},{\"title\":\"- Encerrar contrato;\"},{\"title\":\"- Comprar o bem alugado, pagando-se valor RESIDUAL; É clausula obrigatória? SIM!\"}]},{\"title\":\"Disciplina\",\"children\":[{\"title\":\"Não é contrato tipico\"},{\"title\":\"Aspectos tributarios pela Lei alem do COCNEITO(Lei 6.099/1974)\"},{\"title\":\"Leasing Automotivo - Lei 11.649/2008\"}]},{\"title\":\"Objeto do Contrato FCC - 2018 - MPE-PB - Promotor\",\"children\":[{\"title\":\"Bens MÓVEIS e IMÓVEIS de fabrico nacional OU ESTRANGEIRO\"}]},{\"title\":\"Leasing Automotivo Regramento - Art. 1˚\",\"children\":[{\"title\":\"Nesses contratos, apos quitação de todas parcelas vencidas e vincendas\"},{\"title\":\"Das obrig. pecuniarias previstas em contrato e do envio ao arrendador DE\"},{\"title\":\"Comprovante de pagto dos IPVA e DPVAT e multas nas esferas U, E, M\"},{\"title\":\"Documentos esses acompanhados da opção pela compra do bem\"},{\"title\":\"A sociedade de arrendamento mercantil devem em até 30 dias uteis, apos receber docs.\"},{\"title\":\"Remeter ao arrendatario\",\"children\":[{\"title\":\"I – DUT do veículo devidamente assinado pela arrendadora, a fim de possibilitar que o arrendatário providencie a respectiva transf. de prop. do veículo junto ao DETRAN\"},{\"title\":\"II – a NP vinculada ao contrato e emitida pelo arrendatário, se houver, com o devido carimbo de ‘liquidada’ ou ‘sem efeito’, bem como o termo de quitação do (leasing)”.”\"}]},{\"title\":\"Considera-se nula de PLENO DIREITO\",\"children\":[{\"title\":\"Qlq clausula contratual que seja contraria ao art.\"}]},{\"title\":\"Descumprimento do Art. 1˚\",\"children\":[{\"title\":\"Sujeita ao pagto de multa equivalente a 2% do valor de venda\"},{\"title\":\"Pode a parte cobrar a multa em proc. de execução\"}]}]},{\"title\":\"Especies de Leasing\",\"children\":[{\"title\":\"Financeiro (modalidade tipica)\",\"children\":[{\"title\":\"Bem arrendado nao pertence a arrendadora q apos a indicação compra o bem\"},{\"title\":\"O bem é indicado pelo arrendatario\"},{\"title\":\"A arrendadora tem alto custo inicial. Aluguel deve ser suficentes p/ recup. o credito\"},{\"title\":\"Na opcao de compra o Valor Residual é de pouca monta\"}]},{\"title\":\"Operacional\",\"children\":[{\"title\":\"O bem já é da arrendadora. Não há custo inicial de aquisição\"},{\"title\":\"Arrendadora compromete-se a assistencia tecnica\"},{\"title\":\"Por nao ter custo inicial a soma das prestacoes(alugel) nao pode passar 75% do valor do bem\"},{\"title\":\"Valor residual é alto\"},{\"title\":\"O proprio fabricante ou arrendador é o arrendante\"}]},{\"title\":\"Lease Back - Leasing de Retorno\",\"children\":[{\"title\":\"O bem era do arrendatario que o vende a arrendadora p/ arrenda-lo\"},{\"title\":\"Pode readquirir o bem ao final do contrato\"}]},{\"title\":\"obs\",\"children\":[{\"title\":\"Art. 6º Considera-se arrendamento mercantil operacional a modalidade em que: I - as contraprestações a serem pagas pela arrendatária contemplem o custo de arrendamento do bem e os serviços inerentes a sua colocação à disposição da arrendatária, nãoResolução nº 2.309, de 28 de agosto de 1996. podendo o valor presente dos pagamentos ultrapassar 90% (noventa por cento) do \\\"custo do bem; Art. 8º Os contratos devem estabelecer os seguintes prazos mínimos de arrendamento: I - para o arrendamento mercantil financeiro: a) 2 (dois) anos, compreendidos entre a data de entrega dos bens à arrendatária, consubstanciada em termo de aceitação e recebimento dos bens, e a data de vencimento da última contraprestação, quando se tratar de arrendamento de bens com vida útil igual \\\"ou inferior a 5 (cinco) anos;Resolução nº 2.309, de 28 de agosto de 1996. b) 3 (três) anos, observada a definição do prazo constante da alínea anterior, para o arrendamento de outros bens; II - para o arrendamento mercantil operacional, 90 (noventa) dias. FONTE: Resolução nº 2.309, de 28 de agosto de 1996, do BACEN.\"}]}]},{\"title\":\"Diferenca com Alienação Fiduciaria FCC - 2018 - MPE-PB - Promotor\",\"children\":[{\"title\":\"São modalidades muito diferentes\"},{\"title\":\"Na pratica o leasing é sempre usado como financiamento\"},{\"title\":\"Leasing é uma locação com OPCAO de COMPRA\"},{\"title\":\"A alienacão fiduciaria é um contrato de aquisicao\"},{\"title\":\"No leasing usa-se REINTEG. de POSSE ao inves de BAP\"}]},{\"title\":\"Sum. 369 STJ - consittuição em Mora CESPE / CEBRASPE - 2023 - AGU - PFN\",\"children\":[{\"title\":\"Nesse contrato, ainda que haja clausula resolutiva expressa\"},{\"title\":\"É necessaria notifcacão previa do arrendatario, p/ constituir em mora\"}]},{\"title\":\"OBS\",\"children\":[{\"title\":\"Titulo executivo?\",\"children\":[{\"title\":\"O contrato de arrendamento mercantil é título executivo extrajudicial, tendo em vista que preenche os elementos exigidos pelo sistema processual pátrio, em especial o art. 784, III, do CPC: Art. 784. São títulos executivos extrajudiciais: (...) III - o documento particular assinado pelo devedor e por 2 (duas) testemunhas; O contrato de arrendamento mercantil é um documento particular que, em regra, contém a assinatura do devedor e de duas testemunhas. STJ. 4ª Turma. REsp 1699184-SP, Rel. Min. Luis Felipe Salomão, julgado em 25/10/2022 (Info 755).\"}]},{\"title\":\"receber pagto antes do termo + VENCIMENTO ANTECIPADO\",\"children\":[{\"title\":\"Haverá situações excepcionais em que o credor poderá receber o pagamento, mesmo antes do termo estabelecido originalmente no contrato. O próprio Código Civil prevê, em seu art. 333, uma série de situações em que se dá o vencimento antecipado, conferindo ao credor ao direito de cobrar a dívida antes de vencido prazo estipulado no contrato ou marcado na legislação. Esse rol do art. 333 do CC não é taxativo (numerus clausus), sendo, portanto, exemplificativo (numerus apertus). Nesse sentido, é comum que alguns contratos prevejam o vencimento antecipado da dívida pelo inadimplemento. Essa previsão é, em regra, V Á L I D A. STJ. 4ª Turma. REsp 1699184-SP, Rel. Min. Luis Felipe Salomão, julgado em 25/10/2022 (Info 755).\"}]},{\"title\":\"resilição e mora\",\"children\":[{\"title\":\"Caso adaptado: Alfa Ltda. produz máquinas industriais. Ela celebrou contrato de arrendamento mercantil com a Delta. A Delta arrendou uma máquina industrial e se comprometeu a pagar 60 prestações mensais de R$ 50 mil (5 anos de contrato). Depois de 3 anos de contrato, a Delta tornou-se inadimplente. Havia uma cláusula no contrato dizendo que, na hipótese de inadimplemento, todas as parcelas seriam consideradas vencidas antecipadamente. Diante disso, a Alfa ingressou com execução de título extrajudicial cobrando as parcelas referentes aos 2 anos que faltavam. Depois de ter recebido a citação da execução de título extrajudicial, a Delta (devedora) fez notificação extrajudicial dirigida à Alfa informando que queria fazer a resilição do contrato (desfazimento imotivado do contrato), colocando o bem arrendado à disposição da arrendante. No arrendamento mercantil, a resilição não poderá ser exercida se o contratante se encontrar em mora, devendo, nesses casos, o devedor, suportar todos os riscos de sua inadimplência, sob pena de configurar-se abuso do direito por parte do contratante que pretende resilir. STJ. 4ª Turma. REsp 1699184-SP, Rel. Min. Luis Felipe Salomão, julgado em 25/10/2022 (Info 755).\"}]},{\"title\":\"cobrança antecipada do VRG CESPE / CEBRASPE - 2023 - AGU - PFN FGV - 2022 - AGE-MG - Procurador\",\"children\":[{\"title\":\"Súmula 293 do STJ: \\\"A cobrança antecipada do valor residual garantido (VRG) não descaracteriza o contrato de arrendamento mercantil.\\\"\"}]},{\"title\":\"ARRENDAMENTO MERCANTIL IMPEDE  USUCAPIAO? FGV - 2023 - TJ-ES - Juiz Substituto\",\"children\":[{\"title\":\"A existência de contrato de arrendamento mercantil do bem móvel impede a aquisição de sua propriedade pela usucapião, contudo, verificada a prescrição da dívida, inexiste óbice legal para prescrição aquisitiva. STJ. 4ª Turma. REsp 1528626-RS, Rel. Min. Luis Felipe Salomão, Rel. Acd. Min. Raul Araújo, julgado em 17/12/2019 (Info 667).\"}]},{\"title\":\"iNEXECUÇÃO CONTRATUAL caso fortuito ou de força maior\",\"children\":[{\"title\":\"A resolução por inexecução contratual involuntária em função de caso fortuito ou força maior enseja ao arrendatário o dever de pagar ao arrendante o valor correspondente ao bem recebido (descontado, por óbvio, o valor das parcelas vencidas e quitadas), de modo a restabelecer a situação pretérita ao contrato, especialmente na hipótese em que o possuidor direto deixa de proceder à contratação de seguro do bem arrendado” (REsp n. 1.089.579/MG, relator Ministro Marco Buzzi, Quarta Turma, julgado em 20/6/2013, DJe de 4/9/2013).\"}]}]}]},{\"title\":\"Faturização ou Factoring ou  Fomento Mercantil\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"empresario concede credito a seus clientes. AO CONCEDER ESSE CRÉDITO\"},{\"title\":\"Alem de assumir a insolvencia, chama pra si a tarefa de admin seus devedores\"},{\"title\":\"Serve ao empresario p/ permitir uma melhor organização do seu negocio\"},{\"title\":\"Empresario transfere a uma inst. financeira atribuições atinentes a admin. de seu credito\"},{\"title\":\"Algumas vezes há antecipação desse credito ao empresario\"},{\"title\":\"Inst financeira orienta o empresario acerca da concessão de credito aos seus clentes....\"},{\"title\":\"...Antecipa valor dos creditos que empresario possui e assume risco de inadimplencia\"},{\"title\":\"É uma tecnica de gestão comercial, caracterizada pela participação do faturizador nos negocios\"},{\"title\":\"Não se reconhece como sendo pro solvendo, embora o contrato pode prever\"},{\"title\":\"Factoring não é instituição financeira pq nao faz captaçao de recursos\"},{\"title\":\"Há utilizaçao de recursos proprios em suas atividades\"},{\"title\":\"Callout\",\"children\":[{\"title\":\"A palavra factoring pode ser utilizada tanto para designar o contrato (contrato de factoring) como também a sociedade empresária que celebra esse tipo de ajusta, ou seja, que desenvolve essa atividade. Para entendermos então o que é uma empresa de factoring, é necessário primeiramente sabermos o que é um contrato de factoring. Factoring (ou faturização) é o contrato por meio do qual um empresário (faturizado) cede a uma instituição de factoring (faturizadora), total ou parcialmente, os títulos de créditos recebidos com a atividade empresária para que a factoring antecipe os pagamentos a prazo ou faça apenas a administração desses créditos. As empresas popularmente conhecidas como factoring desempenham atividades de fomento mercantil, de cunho meramente comercial, em que se ajusta a compra de créditos vencíveis, mediante preço certo e ajustado, e com recursos próprios, não podendo ser caracterizadas como instituições financeiras. STJ. 3ª Seção. CC 98.062/SP, Rel. Min. Jorge Mussi, julgado em 25/08/2010.\"}]}]},{\"title\":\"Especies\",\"children\":[{\"title\":\"Conventional Factoring\",\"children\":[{\"title\":\"Há antecipação dos valores referentes ao credito do faturizado\"},{\"title\":\"Ou seja, Admin do credito, seguro e financiamento\"}]},{\"title\":\"Maturity Factoring\",\"children\":[{\"title\":\"Há apenas prestacão dos serviços de administração de credito\"},{\"title\":\"Admin do credito e seguro\"}]}]},{\"title\":\"Caracteristicas\",\"children\":[{\"title\":\"Faturizador não é obrigado a aceitar todos os creditos passados. Pode analisa-los\"},{\"title\":\"Empresas de factoring nao precisam de autorização do BACEN, não são inst. financeiras\"},{\"title\":\"Clausula de Exclusividade - Não contratar outro faturizador\"},{\"title\":\"C. de Totalidade - Faturizado transmite todos os creditos ao faturizador, cabe a este escolher\"},{\"title\":\"Clausula de aprovação - Prevista pelo faturizador\"}]},{\"title\":\"Factoring X Agiotagem\",\"children\":[{\"title\":\"Agiotagem é atividade ilicita\"},{\"title\":\"Deve-se analisar se são prestados serviços  de admin. de credito e se são op. constantes ou esporad.\"}]},{\"title\":\"Callout\",\"children\":[{\"title\":\"Pode celebrar mutuo feneratício?\",\"children\":[{\"title\":\"Embora não constitua instituição financeira, não é vedado à sociedade empresária de factoring celebrar contrato de mútuo feneratício, devendo apenas serem respeitadas as regras dessa espécie contratual aplicáveis aos particulares, especialmente quanto aos juros devidos e à capitalização. STJ. 3ª Turma. REsp 1987016-RS, Rel. Min. Nancy Andrighi, julgado em 06/09/2022 (Info 750).\"}]},{\"title\":\"Faturizada responde pela insolvencia?\",\"children\":[{\"title\":\"A empresa faturizada não responde pela insolvência dos créditos cedidos, sendo nulos a disposição contratual em sentido contrário e eventuais títulos de créditos emitidos com o fim de garantir a solvência dos créditos cedidos no bojo de operação de factoring. A natureza do contrato de factoring, diversamente do que se dá no contrato de cessão de crédito puro, não permite que os contratantes, ainda que sob o argumento da autonomia de vontades, estipulem a responsabilidade da cedente (faturizada) pela solvência do devedor/sacado. STJ. 3ª Turma. REsp 1711412-MG, Rel. Min. Marco Aurélio Bellizze, julgado em 04/05/2021 (Info 695). Observação: o entendimento acima é diferente do caso das factorings. Não se admite a estipulação de garantia em favor da empresa de factoring no que se refere, especificamente, ao inadimplemento dos títulos cedidos, salvo na hipótese em que a inadimplência é provocada pela própria empresa faturizada (STJ. 4ª Turma. AgInt no AREsp 1385554/SE, Rel. Min. Antonio Carlos Ferreira, julgado em 09/09/2019).\"}]},{\"title\":\"É desnecessária a notificação de emitente de cheque com cláusula \\\"à ordem\\\", para que o faturizador que tenha recebido a cártula por meio de endosso possa cobrar o crédito decorrente de operação de factoring. STJ. 4ª Turma. REsp 1236701-MG, Rel. Min. Luis Felipe Salomão, julgado em 5/11/2015 (Info 573).\"},{\"title\":\"POLO PASSIVO DE DEMANDAS Q VISEM REVISAO DE CLAUSULAS\",\"children\":[{\"title\":\"A empresa de factoring, que figura como cessionária dos direitos e obrigações estabelecidos em contrato de compra e venda em prestações, de cuja cessão foi regularmente cientificado o devedor, tem legitimidade para figurar no polo passivo de demandas que visem à revisão das condições contratuais. Ex: Pedro comprou da loja uma moto parcelada. No mesmo instrumento contratual, a loja cedeu esse crédito para uma factoring. Assim, no próprio contrato de compra e venda havia uma cláusula dizendo que a loja estava cedendo o crédito para a factoring, a quem o devedor deveria pagar as parcelas e que, em caso de inadimplemento, a factoring iria pleitear a restituição do bem vendido. Se Pedro desejar propor ação pedindo a revisão deste contrato, poderá ajuizá-la diretamente contra a factoring. STJ. 4ª Turma.REsp 1343313-SC, Rel. Min. Luis Felipe Salomão, Rel. para acórdão Min. Antônio Carlos Ferreira, julgado em 1/6/2017 (Info 608).\"}]}]}]},{\"title\":\"Cartão de Crédito\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"Contrato por meio do qual uma instituição financeira, a operadora do cartão, permite\"},{\"title\":\"Aos seus clientes a compra de bens e serviços em estabelecimentos comerciais cadastrados\"},{\"title\":\"Que receberão os valores das compras diretamente das operadoras\"},{\"title\":\"A op. cobra dos clientes, mensalmente, o valor de todas suas compras\"},{\"title\":\"Só há relação de consumo quando tem o cliente presente\"},{\"title\":\"Entre operadora e estab. comercial não há relação consumeirista\"}]},{\"title\":\"Sujeitos Envolvidos\",\"children\":[{\"title\":\"Operadora com cliente\"},{\"title\":\"Cliente com estab. comercial\"},{\"title\":\"Estab. comercial com a operadora\"}]},{\"title\":\"STJ\",\"children\":[{\"title\":\"Não incide a limitação de juros e 12% a.a(são inst. financeiras)\"},{\"title\":\"Cliente tem dirieto a prestação de contas por parte da operadora\"},{\"title\":\"Estab. comercial deve conferir a assinatura do titular do cartão\"}]}]}]},{\"title\":\"Contrato de Seguro\",\"children\":[{\"title\":\"Intro\",\"children\":[{\"title\":\"Contrato bem antigo que atualmente está regulado no Art. 757 do CC\"}]},{\"title\":\"Conceito\",\"children\":[{\"title\":\"O segurador se obriga, mediante pagto do premio\"},{\"title\":\"A garantir interesse legitimo do segurado relativo a pessoa ou coisa\"},{\"title\":\"Contra riscos PREDETERMINADOS\"}]},{\"title\":\"Natureza Juridica\",\"children\":[{\"title\":\"Contrato aleatorio? Com CC/02 a obrigação tornou-se certa? Doutrina diverge\"}]},{\"title\":\"Caracteristicas\",\"children\":[{\"title\":\"Contrato consensual\"},{\"title\":\"Contrato de Adesão\"},{\"title\":\"Contrato Dirigido(regulado pela SUSEP)\",\"children\":[{\"title\":\"Art. 762\",\"children\":[{\"title\":\"Nulo é o contrato p/ risco decorrente de ato doloso\"}]}]},{\"title\":\"Mutualidade\",\"children\":[{\"title\":\"Repartição dos riscos entre segurados\"}]},{\"title\":\"Forte regulamentação estatal (CNSP - SUSEP - Resseguradores - S.A autorizadas - Corretores PF ou PJ\",\"children\":[{\"title\":\"Art. 775\",\"children\":[{\"title\":\"Ag. autorizados do segurador presumem-se seus representa- ntes p/ todos atos relativos ao contratos que agenciarem\"}]}]}]},{\"title\":\"Seguradora\",\"children\":[{\"title\":\"Entidade legalmente autorizada para tal fim\"},{\"title\":\"Atividade deve ser exercida por S.A, MUTUAS ou COOPERATIVAS\"},{\"title\":\"Necessitam autorização do Gov. Federal\"},{\"title\":\"Enunciado n˚ 185 do CJF/STJ - COPIAR\"}]},{\"title\":\"Partes do Contrato\",\"children\":[{\"title\":\"Segurado que paga o premio\"},{\"title\":\"Segurador q recebe o premio\"}]},{\"title\":\"Prova do Contrato\",\"children\":[{\"title\":\"Apolice ou BILHETE DO SEGURO. E na falta deles?\"},{\"title\":\"Doc. comprobatorio do pagto do respectivo premio\"},{\"title\":\"Entendimento STJ\",\"children\":[{\"title\":\"Seguradora de veiculos nao pode, sob justificativa de nao ter sido emitida apolice\"},{\"title\":\"Negar-se a indenizar o sinistro se nao houve recusa da proposta pela seguradora\"},{\"title\":\"O seguro é contrato consensual e aperfeiçoa-se na manif. de vontade\"},{\"title\":\"Independentemente da emissão da apoline, que é ato unilateral da seguradora\"}]}]},{\"title\":\"Regras Gerais\",\"children\":[{\"title\":\"Intro\",\"children\":[{\"title\":\"Aplicação do CC é supletiva, visto que o contrato tem regulamentação propria\"}]},{\"title\":\"Apolice\",\"children\":[{\"title\":\"Precedida de proposta escrita com declaração dos elementos essenciais do garantido e do risco\"},{\"title\":\"Será nominativo, a ordem ou ao portador. OBS: Seguro de pessoas não podem ser AO PORTADOR\"},{\"title\":\"Mencionará os riscos e o inicio e fim da proteçao e o limite do premio\"},{\"title\":\"Qnd for o caso mencionara o segurado e os beneficiarios\"}]},{\"title\":\"Boa-fé e Veracidade(765)\",\"children\":[{\"title\":\"Se o segurado fizer declarações inexatas ou omitir circunstancias pode perder o direito ao premio\"},{\"title\":\"SE a inexatidão nao for de má-fé segurador pode resolver o contrato ou cobrar a diferença\"}]},{\"title\":\"Cosseguro\",\"children\":[{\"title\":\"Qnd risco for assumido em Cosseguro a apolice indicará o seguror q admin. o contrato\"},{\"title\":\"Esse cossegurador representara os demais, para todos os efeitos\"}]},{\"title\":\"Mora no Pagto\",\"children\":[{\"title\":\"Ocorrendo sinistro antes da purgação da mora, não há direito a indenização\"},{\"title\":\"STJ - Mora não ocorre com o mero atraso, a seguradora deve interpelar o segurado\"},{\"title\":\"STJ - O atraso longo e continuado é suficiente para caracterização\"}]},{\"title\":\"Risco\",\"children\":[{\"title\":\"Não tendo ocorrido o segurado não se exime do pagto do premio, salvo exceções legais\"},{\"title\":\"Segurado perde o direito se agravar intencionalmente o risco - O msm ocorre em caso de forjar\"},{\"title\":\"STJ - Embriaguez, se for ocasional, não configura agravamento do risco\"},{\"title\":\"Segurado é obrigado a informar o sinistro e tudo q o agrava, sob pena de perder a garantia se má-fe\"},{\"title\":\"O segurador dentro de 15d da agravação do risco sem culpa do segurado, poderá dar ciencia do fim c\"},{\"title\":\"A resolução só será eficaz 30d apos a notificação, devendo restituir o preço do premio pago\"},{\"title\":\"Em seguro a conta de outrem, segurador pode opor qlq defesa que tenha contra, por descump. regras\"},{\"title\":\"A diminuição do risco durante o contrato não acarreta redução do premio, sendo consideravel, sim\"}]},{\"title\":\"Sinistro\",\"children\":[{\"title\":\"Segurado deve tomar atitudes que diminuam o prejuizo, sob pena de perder\"},{\"title\":\"As despesas de salvamento consequente do sinistro correm a conta do segurador\"},{\"title\":\"Mora do segurador no pagto do sinistro obriga a mora, att. e juros\"},{\"title\":\"Segurado que sabe q o risco nao existe e faz apolice deve paga-la em dobro\"},{\"title\":\"O pagto é em dinheiro em caso de sinistro, salvo se estipulado no contrato a coisa\"},{\"title\":\"Reconduçõa tacita do contrato por msm prazo, mediante clausula, nao pode ocorrer mais de 1 vez\"}]}]},{\"title\":\"Seguro de Dano\",\"children\":[{\"title\":\"Conceito\",\"children\":[{\"title\":\"Modalidade de seguro em q a seguradora garante contra eventuais prejuizos\"},{\"title\":\"No patrimonio, em saude ou integridade fisica(função indenizatória)\"},{\"title\":\"Visa repor perdas sofridas em razão da ocorrencia do evento\"},{\"title\":\"Compreende prejuizos resultantes ou consequentes, como sejam os estragos\"},{\"title\":\"Segurador garante todos riscos inerentes as ativ. desenvolvidas pelo segurado\"},{\"title\":\"STJ\",\"children\":[{\"title\":\"É nula clausula q exclui da indenização riscos de danos em op. de cargas e descargas\"}]}]},{\"title\":\"Indenização\",\"children\":[{\"title\":\"Nao pode ultrapassar o valor do interesse do segurado no momento da conclusao contratual,\"},{\"title\":\"Sob pena de incidir o art. 766, sem prejuizo de eventual ação penal\"},{\"title\":\"O segurado tb nao pode ocntratar pelo valor integral mais de um seguro de dano do mesmo interesse\"},{\"title\":\"Isso se chama SOBRESSEGURO, Pode contratar mais de um caso cada seguradora assuma uma parte\"},{\"title\":\"Essa comunicação de novo seguro deve ser feita por escrito\"},{\"title\":\"Em caso de sinistro parcial há redução proporcional da indeniz.\"}]},{\"title\":\"Vicio Intrinseco\",\"children\":[{\"title\":\"Nao se inclue na garantia, se nao foi declarado pelo segurado\"},{\"title\":\"Significa o defeito proprio da coisa, q nao se encontra normalmente em outras especies\"}]}]}]},{\"title\":\"Outros Contratos\",\"children\":[{\"title\":\"Certificado de Recebiveis Imobiliários(CRI) CESPE / CEBRASPE - 2023 - TJ-DFT - Juiz de Direito Substituto\",\"children\":[{\"title\":\"CRIs são títulos de renda fixa de crédito privado que representam a promessa de um pagamento futuro referente a imóveis. Tratam-se de títulos lastreados em créditos imobiliários, representativos de parcelas de um direito creditório. Neste caso, o investidor de CRI ajuda a financiar o mercado imobiliário ao antecipar os créditos que serão recebidos pelo setor. O instrumento permite que exista, por parte de instituições financeiras que possuem lastro imobiliário, a possibilidade destas capitalizarem recursos no mercado financeiro à vista, securitizando fluxos de recebíveis de médio e longo prazos. Os CRIs só podem ser emitidos por companhias securitizadoras de créditos imobiliários, as quais NÃO fazem o papel de devedoras na operação. O ativo deverá ser registrado em sistema de registro e de liquidação financeira de ativos autorizados a funcionar pelo Banco Central do Brasil. artigo 22, IV, Lei 14.430,/22: \\\"Os Certificados de Recebíveis integrantes de cada emissão da companhia securitizadora serão formalizados por meio de termo de securitização, do qual constarão as seguintes informações: IV - valor nominal\\\" . artigo 6º, Lei 9.514/97: \\\"Do Certificado de Recebíveis Imobiliários - Art. 6º O Certificado de Recebíveis Imobiliários - CRI é título de crédito nominativo, de livre negociação, lastreado em créditos imobiliários e constitui promessa de pagamento em dinheiro.\\\" artigo 21, §1º, Lei 14.430/22: \\\" Aos Certificados de Recebíveis aplica-se, no que couber, o disposto na legislação cambial. (PODE SER GARANTIDO POR AVAL)\"}]},{\"title\":\"Contrato de Concessão Comercial entre Produtores e Distribuidores de Veiculos Automotores Lei nº 6.729/78  FGV - 2022 - Senado Federal - Consultor FGV - 2023 - SMF-RJ - Fiscal de Rendas\"},{\"title\":\"Cédula de Crédito Industrial DL 413/69 FGV - 2023 - TJ-ES - Juiz Substituto\"},{\"title\":\"Cédula de Crédito Rural\",\"children\":[{\"title\":\"obs\",\"children\":[{\"title\":\"A cédula de crédito rural é título executivo extrajudicial com os atributos de certeza, liquidez e exigibilidade. A existência de cláusula/contrato de seguro relacionado à cédula de crédito rural não retira os atributos próprios do título. STJ. 4ª Turma. AgInt no AREsp 2.144.537-GO, Rel. Min. Marco Buzzi, julgado em 17/4/2023 (Info 774).\"}]}]},{\"title\":\"Certificado de Direitos Creditórios do Agronegócio – CDCA\"}]}]}}";const DATA = JSON.parse(RAW);

const CHAPTERS = ["cap0","cap1","cap2","cap3","cap4","cap5","cap6","cap7"];
const LABELS = {"cap0": "0. Evolução Histórica do D. Comercial", "cap1": "1. Regras do D. de Empresa no CC/02", "cap2": "2. Direito de Propriedade Industrial", "cap3": "3. Direito Societário (Itens 1–6)", "cap4": "4. Operações Societárias", "cap5": "5. Dissolução, Liquidação e Extinção das Soc.", "cap6": "6. Títulos de Crédito", "cap7": "7. Contratos Bancários"};

let cur = CHAPTERS[0];
let expanded = new Set();
let term = "";
let hits = 0;

function detectType(t){
  const s=(t||"").toLowerCase();
  if(/cespe|cebraspe|fgv|vunesp|fundatec|ibfc|prova/.test(s)) return "cespe";
  if(/stj|stf|resp|adi|adpf|adc|\bre\b|rms|agrg|info \d|súmula|sumula|julgado/.test(s)) return "stj";
  return "obs";
}

function extractText(n,d=0){
  if(d>4) return n.title||"";
  let p=[n.title||""];
  (n.children||[]).forEach(c=>p.push(extractText(c,d+1)));
  (n.callouts||[]).forEach(c=>p.push(extractText(c,d+1)));
  return p.filter(Boolean).join(" • ");
}

function matches(n,t){
  if(!t) return true;
  if((n.title||"").toLowerCase().includes(t)) return true;
  if((n.children||[]).some(c=>matches(c,t))) return true;
  if((n.callouts||[]).some(c=>matches(c,t))) return true;
  return false;
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function hilite(s,t){
  if(!t) return esc(s);
  const re=new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi");
  return esc(s).replace(re,"<mark>$1</mark>");
}

function renderCallout(node){
  const tipo=detectType(node.title||"");
  const label={cespe:"CESPE/CEBRASPE",stj:"STF/STJ",obs:"OBS"}[tipo];
  const text=extractText(node);
  const isTrivial=!node.title||/^(obs|callout|atenção)$/i.test((node.title||"").trim());
  const titleHtml=isTrivial?"":(`<div class="callout-title">${hilite(node.title,term)}</div>`);
  return `<div class="callout-box ${tipo}"><div class="callout-label">${label}</div>${titleHtml}<div class="callout-body">${esc(text)}</div></div>`;
}


var _EXAM_RE=/^\s*(CESPE\s*[\/]?\s*CEBRASPE|CEBRASPE|CESPE|FCC|FGV|VUNESP|ESAF|CESGRANRIO|MPT|AOCP|IBFC|IADES|FUNCAB|FUNDEP|QUADRIX|SELECON|OBJETIVA|NUCEPE|CS-UFG|INAZ|CONSULPLAN|NC-UFPR)\b/i;
var _YEAR_RE=/\b(20\d{2}|199\d)\b/;
function _isExam(t){return _EXAM_RE.test(t)&&_YEAR_RE.test(t);}
function _examShort(t){
  var b=t.match(_EXAM_RE);var y=t.match(_YEAR_RE);
  var banca=(b?b[1].replace(/\s*\/\s*CEBRASPE/i,'').replace(/\s*CEBRASPE\s*\/\s*/i,'').trim():'');
  return banca+(y?' '+y[0]:'');
}
var _BANCA_PAT=/(CESPE\s*[\/]?\s*CEBRASPE|CEBRASPE|CESPE|FCC|FGV|VUNESP|ESAF|CESGRANRIO|MPT|AOCP|IBFC|IADES|FUNCAB|FUNDEP|QUADRIX|SELECON|OBJETIVA|NUCEPE|CS-UFG|INAZ|CONSULPLAN|NC-UFPR)\b/gi;
function _inlineExams(t){
  var m,first=null,p=new RegExp(_BANCA_PAT.source,'gi');
  while((m=p.exec(t))!==null){if(_YEAR_RE.test(t.slice(m.index,Math.min(t.length,m.index+120)))){first=m.index;break;}}
  if(first===null||first===0)return null;
  var content=t.slice(0,first).trim(),ep=t.slice(first);
  p.lastIndex=0;var cuts=[0];
  while((m=p.exec(ep))!==null){if(m.index>0)cuts.push(m.index);}
  var tags=[];
  for(var i=0;i<cuts.length;i++){
    var ref=ep.slice(cuts[i],i+1<cuts.length?cuts[i+1]:ep.length).trim().replace(/[-–,\s]+$/,'');
    if(!_YEAR_RE.test(ref))continue;
    var b=ref.match(_EXAM_RE),y=ref.match(_YEAR_RE);
    var sh=(b?b[1].replace(/\s*\/\s*CEBRASPE/i,'').replace(/CEBRASPE\s*\/\s*/i,'').trim():'')+(y?' '+y[0]:'');
    tags.push({full:ref,short:sh.trim()});
  }
  return tags.length?{content:content,tags:tags}:null;
}

function xpand(el,ev){el.classList.toggle('open');ev.stopPropagation();}
var _QQ=/\?\s*$/;
function _qm(x){return _QQ.test(x)?'?':'\u00b7';}
function _qSplit(t){
  if(!t)return null;
  var L=String(t).replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n')
        .map(function(x){return x.trim();}).filter(function(x){return x;});
  if(L.length<3)return null;
  var fq=-1;
  for(var i=0;i<L.length;i++){if(_QQ.test(L[i])){fq=i;break;}}
  if(fq<1)return null;
  var h=L.slice(0,fq).join(' ').trim(), body=L.slice(fq);
  if(!h||h.length>80)return null;
  if(body.length<2)return null;
  var qn=0;
  for(var j=0;j<body.length;j++){
    if(body[j].length>120)return null;
    if(_QQ.test(body[j]))qn++;
  }
  if(qn<2||qn*2<body.length)return null;
  return {head:h,qs:body};
}
function renderNode(n,depth,path){
  const id=path;
  const hasKids=(n.children&&n.children.length)||(n.callouts&&n.callouts.length);
  const isExp=expanded.has(id)||(term&&matches(n,term));
  const isHit=term&&(n.title||"").toLowerCase().includes(term);
  if(isHit) hits++;

  if(n.callout) return renderCallout(n);

  // Exam reference node → pill
  if(_isExam(n.title||'')&&depth>0){
    const full=esc(n.title||'');const short=esc(_examShort(n.title||''));
    return `<div class="node exam-node" id="n${id}"><div class="row"><span class="exam-tag" data-full="${full}">${short}</span></div></div>`;
  }

  const tog=hasKids?(isExp?"▾":"▸"):"·";
  const dc=depth===0?"d0":depth===1?"d1":depth===2?"d2":"dn";
  const rowCls=`row${isHit?" hit":""}`;
  const _q=_qSplit(n.title||'');
  const _ie=_q?null:_inlineExams(n.title||'');
  let titleHtml;
  if(_q){
    titleHtml=`<span class="txt ${dc}">${hilite(_q.head,term)}</span>`;
  } else if(_ie){
    const pills=_ie.tags.map(function(t){return `<span class="exam-tag" data-full="${esc(t.full)}">${esc(t.short)}</span>`;}).join(' ');
    const _xl=_ie.content.length>120;
    titleHtml=`<span class="txt ${dc}${_xl?' long':''}"${_xl?' onclick="xpand(this,event)"':''} >${hilite(_ie.content,term)}</span> ${pills}`;
  } else {
    const _long=(n.title||"").length>120&&depth>0;
    titleHtml=_long?`<span class="txt ${dc} long" onclick="xpand(this,event)">${hilite(n.title||"",term)}</span>`:`<span class="txt ${dc}">${hilite(n.title||"",term)}</span>`;
  }

  let childHtml="";
  if(isExp&&hasKids){
    childHtml='<div class="children">';
    (n.children||[]).forEach((c,i)=>{if(!term||matches(c,term)) childHtml+=renderNode(c,depth+1,path+"_"+i);});
    (n.callouts||[]).forEach((c,i)=>{if(!term||matches(c,term)) childHtml+=renderNode({...c,callout:true},depth+1,path+"_c"+i);});
    childHtml+="</div>";
  }
  const _qh=_q?`<div class="qblock">${_q.qs.map(function(x){return `<div class="qline"><span class="qm">${_qm(x)}</span><span>${hilite(x,term)}</span></div>`;}).join('')}</div>`:"";
  return `<div class="node" id="n${id}"><div class="${rowCls}" onclick="toggle('${id}')"><span class="tog">${tog}</span>${titleHtml}</div>${_qh}${childHtml}</div>`;
}

function render(){
  const tree=DATA[cur];
  hits=0;
  let html="";
  if(tree.children){
    tree.children.forEach((n,i)=>{
      if(!term||matches(n,term)) html+=renderNode(n,0,"r"+i);
    });
  }
  document.getElementById("content").innerHTML=html||`<p class="no-res">Nenhum resultado para "${esc(term)}"</p>`;const em=document.getElementById("empty-msg");if(em)em.remove();
  const mb=document.getElementById("matchBar");
  if(term){mb.style.display="block";mb.textContent=`${hits} ocorrência(s) para "${term}"`;}
  else{mb.style.display="none";}
}

function renderTabs(){
  document.getElementById("tabs").innerHTML=CHAPTERS.map((k,i)=>{
    const cid='dempresarial_'+i;
    const isDone=_TRK&&_TRK.done&&_TRK.done[cid];
    return `<div class="tab${k===cur?' active':''}" onclick="selChap('${k}')">
      <input type="checkbox" class="_trk_chk" data-cid="${cid}" ${isDone?'checked':''} onclick="event.stopPropagation();_trkToggle('${cid}',this.checked,this)"/>
      <span>${LABELS[k]||k}</span>
    </div>`;
  }).join("");
}

function selChap(k){cur=k;expanded.clear();document.getElementById("search").value="";term="";document.getElementById("matchBar").style.display="none";renderTabs();render();}
function toggle(id){if(expanded.has(id))expanded.delete(id);else expanded.add(id);render();}
function expandAll(){function add(n,p){expanded.add(p);(n.children||[]).forEach((c,i)=>add(c,p+"_"+i));(n.callouts||[]).forEach((c,i)=>add(c,p+"_c"+i));}const t=DATA[cur];(t.children||[]).forEach((n,i)=>add(n,"r"+i));render();}
function collapseAll(){expanded.clear();render();}
var _kbP=null;
function _kbRows(){return Array.prototype.slice.call(document.querySelectorAll('#content .node>.row'));}
function _kbSet(row){var old=document.querySelectorAll('.row.kbf');for(var i=0;i<old.length;i++)old[i].classList.remove('kbf');if(row){row.classList.add('kbf');_kbP=row.parentElement.id.slice(1);row.scrollIntoView({block:'nearest'});}}
function _kbCur(){var rows=_kbRows();for(var i=0;i<rows.length;i++)if(rows[i].classList.contains('kbf'))return i;return -1;}
function _kbRefocus(){if(_kbP){var nd=document.getElementById('n'+_kbP);if(nd)_kbSet(nd.firstElementChild);}}
document.addEventListener('keydown',function(e){
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  var rows,i,row,tog,idx;
  if(e.key==='ArrowDown'){e.preventDefault();rows=_kbRows();i=_kbCur();_kbSet(i<0?rows[0]:rows[Math.min(i+1,rows.length-1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();rows=_kbRows();i=_kbCur();_kbSet(i<=0?rows[0]:rows[i-1]);}
  else if(e.key==='ArrowRight'){e.preventDefault();rows=_kbRows();i=_kbCur();if(i<0){_kbSet(rows[0]);return;}row=rows[i];tog=row.querySelector('.tog');
    if(tog&&tog.textContent==='▸'){toggle(row.parentElement.id.slice(1));_kbRefocus();}
    else if(tog&&tog.textContent==='▾'){_kbSet(rows[Math.min(i+1,rows.length-1)]);}}
  else if(e.key==='ArrowLeft'){e.preventDefault();rows=_kbRows();i=_kbCur();if(i<0)return;row=rows[i];tog=row.querySelector('.tog');
    var p=row.parentElement.id.slice(1);
    if(tog&&tog.textContent==='▾'){toggle(p);_kbRefocus();}
    else{var pp=p.replace(/_[^_]*$/,'');if(pp!==p){var nd=document.getElementById('n'+pp);if(nd)_kbSet(nd.firstElementChild);}}}
  else if(e.key==='PageDown'){e.preventDefault();idx=CHAPTERS.indexOf(cur);if(idx<CHAPTERS.length-1)selChap(CHAPTERS[idx+1]);}
  else if(e.key==='PageUp'){e.preventDefault();idx=CHAPTERS.indexOf(cur);if(idx>0)selChap(CHAPTERS[idx-1]);}
  else if(e.key==='e'||e.key==='E'){expandAll();}
  else if(e.key==='r'||e.key==='R'){collapseAll();}
});


let deb;
document.getElementById("search").addEventListener("input",function(){
  clearTimeout(deb);
  deb=setTimeout(()=>{term=this.value.toLowerCase().trim();render();},250);
});

renderTabs();
render();
</script>

async function _trkLoad(){
  try{
    var r = await _sb.from('progress')
      .select('chapter_id,done')
      .eq('user_id', _TRK.user.id);
    _TRK.done = {};
    if(r.data) r.data.forEach(function(row){
      if(row.done && row.chapter_id.startsWith(_TRK.mapId+'_'))
        _TRK.done[row.chapter_id] = true;
    });
    try{ Object.keys(_TRK.done).forEach(function(cid){ localStorage.setItem('_pgprog_'+cid,JSON.stringify({done:true,date:null})); }); }catch(_){}
    _trkRender();
  }catch(e){ console.warn('tracker load err', e); }
}

function _trkRender(){
  var count = Object.keys(_TRK.done).length;
  var pct = _TRK.total ? Math.round(count/_TRK.total*100) : 0;
  // Update both injected header bar and sidebar bar
  ['_trk_fill','trk-fill'].forEach(function(id){var el=document.getElementById(id);if(el)el.style.width=pct+'%';});
  ['_trk_pct','trk-pct'].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=pct+'%';});
  ['_trk_cnt','trk-cnt'].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=count+'/'+_TRK.total;});

  document.querySelectorAll('._trk_chk').forEach(function(chk){

    var w = chk.closest('._chk_wrap');

  });
  renderTabs();
}

async function _trkToggle(chapterId, done, chk){
  var now = done ? new Date().toISOString() : null;
  if(done) _TRK.done[chapterId] = true;
  else delete _TRK.done[chapterId];
  _trkRender();
  try{ localStorage.setItem('_pgprog_'+chapterId, JSON.stringify({done:done, date:now})); }catch(_){}
  if(!_TRK.user){
    try {
      const r = await _sb.auth.getSession();
      if(r.data && r.data.session && r.data.session.user) _TRK.user = r.data.session.user;
      else return;
    } catch(e) { return; }
  }
  try{

      chapter_id: chapterId,
      done: done,
      done_at: now
    }, {onConflict: 'user_id,chapter_id'});
  }catch(e){ console.warn('tracker save err', e); }
  try{ localStorage.setItem('_pgprog_'+chapterId, JSON.stringify({done, date:now})); }catch(_){}
}
