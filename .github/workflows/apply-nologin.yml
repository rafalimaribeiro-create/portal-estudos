name: Apply no-login patch

on:
  push:
    paths:
      - '.github/workflows/apply-nologin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/apply_nologin.py .

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'EOF'
          import re, subprocess, glob, sys
          bad = 0
          for f in sorted(glob.glob('*.html')):
              src = open(f, encoding='utf-8').read()
              for idx, s in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', src, re.DOTALL)):
                  t = s.strip()
                  if not t or t[:2] in ('[{', '{"'):
                      continue
                  open('/tmp/_c.js', 'w', encoding='utf-8').write(s)
                  if subprocess.run(['node', '--check', '/tmp/_c.js'], capture_output=True).returncode:
                      bad += 1
                      print('SYNTAX ERROR', f, idx)
          print('JS syntax:', 'OK' if not bad else f'{bad} errors')
          sys.exit(1 if bad else 0)
          EOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit - patch already applied."
          else
            git commit -m "Remove login requirement; add ADI 7.783/PE (Info 1211)"
            git push
          fi
