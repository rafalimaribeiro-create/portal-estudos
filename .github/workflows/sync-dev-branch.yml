name: Sync dev branch

on:
  push:
    paths:
      - '.github/workflows/sync-dev-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward dev branch to main
        run: |
          # Pure fast-forward: the dev branch tip is already an ancestor of main,
          # so this only advances the ref and cannot discard any commit.
          git push origin HEAD:claude/fix-progress-tracker-bCIxg
